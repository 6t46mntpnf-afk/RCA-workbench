<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rootline: root cause analysis, lessons learned and safety alerts in one place. Guided 5 Whys, optional fishbone, failure history, actions and customer-ready reports.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rootline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Rootline</title>
<style>
/* Base reset (matches the Claude artifact skeleton so the page looks the same in both places) */
:root { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0 } img { max-width: 100% } [hidden] { display: none !important }
/* Manrope (SIL Open Font Licence, see vendor/manrope-OFL.txt), served from this app so it works offline */
@font-face { font-family: "Manrope"; font-style: normal; font-display: swap; font-weight: 200 800; src: url(vendor/manrope-latin-wght-normal.woff2) format("woff2") }
/* Layout: Steel & Copper app shell (matches Foreman HQ). Sidebar on desktop, bottom tab bar + add button on phone.
   Views: dashboard, RCA register, one RCA (step rail + working card), lessons learned, safety alerts, settings. Records open in a sheet. */
:root {
  --bg: #F4F4F2; --surface: #FFFFFF; --surface-2: #EFEFEC; --fg: #1A1A1A; --muted: #6B6B66; --line: #E3E3DF; --hair: #ECECEA;
  --solid: #1A1A1A; --solid-fg: #FFFFFF; --accent: #B0683A; --accent-soft: #F6EBE3;
  --amber: #9A5B12; --amber-soft: #FBF1E3; --red: #B3261E; --red-soft: #FBECEB; --green: #2F6B3A; --green-soft: #E7F1E6; --blue: #2C5A8A; --blue-soft: #E8EFF6;
  --mk-bg: #1A1A1A; --mk-fg: #FFFFFF; --mk-cu: #B0683A;
  --shadow: 0 1px 2px rgba(26,26,26,.04), 0 6px 24px rgba(26,26,26,.05);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* older step styles read these names */
  --primary: var(--solid); --primary-fg: var(--solid-fg); --teal: var(--accent); --teal-soft: var(--accent-soft); --surface2: var(--surface-2); --focus: var(--accent);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --surface: #1C1C1A; --surface-2: #262624; --fg: #ECECE8; --muted: #A3A39C; --line: #2E2E2B; --hair: #262624;
  --solid: #ECECE8; --solid-fg: #1A1A1A; --accent: #D08A5A; --accent-soft: #33261D;
  --amber: #E2A65A; --amber-soft: #36291A; --red: #F08A80; --red-soft: #3A1F1C; --green: #7CC48A; --green-soft: #1D2E20; --blue: #8DB3E0; --blue-soft: #1C2734;
  --mk-bg: #EDEDEA; --mk-fg: #151515; --mk-cu: #D08A5C; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1C1C1A; --surface-2: #262624; --fg: #ECECE8; --muted: #A3A39C; --line: #2E2E2B; --hair: #262624;
  --solid: #ECECE8; --solid-fg: #1A1A1A; --accent: #D08A5A; --accent-soft: #33261D;
  --amber: #E2A65A; --amber-soft: #36291A; --red: #F08A80; --red-soft: #3A1F1C; --green: #7CC48A; --green-soft: #1D2E20; --blue: #8DB3E0; --blue-soft: #1C2734;
  --mk-bg: #EDEDEA; --mk-fg: #151515; --mk-cu: #D08A5C; --shadow: none; color-scheme: dark }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14.5px; line-height: 1.5; letter-spacing: -.005em }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -.02em }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .86em; color: var(--muted) }
.muted { color: var(--muted) }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh }
.side { position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--hair); display: flex; flex-direction: column; padding: 18px 12px 16px max(12px, env(safe-area-inset-left, 0px)) }
.appname { display: flex; align-items: center; gap: 10px; padding: 0 8px 16px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; line-height: 1.1 }
.appname .mark { width: 38px; height: 38px; flex: none }
.appname .tag { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 3px }
.newbtn { width: 100%; margin: 0 0 14px; min-height: 44px; font-size: 15px; border-radius: 12px }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600 }
.nav a:hover { background: var(--bg); color: var(--fg) }
.nav a[aria-current="page"] { background: var(--bg); color: var(--fg) }
.nav a[aria-current="page"] svg { color: var(--accent) }
.nav svg { width: 18px; height: 18px; flex: none }
.nav .count { margin-left: auto; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums }
.nav .count.bad { color: var(--red) }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 10px; font-size: 11.5px; color: var(--muted) }
.sync { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted) }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none }
.sync[data-s="ok"] i { background: var(--green) } .sync[data-s="busy"] i { background: var(--amber) } .sync[data-s="err"] i { background: var(--red) } .sync[data-s="err"] { color: var(--red); font-weight: 600 }
main.view { min-width: 0; padding-block: 24px 48px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
.mtop { display: none }
.tabbar, .fab { display: none }

.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px }
.vhead .grow { flex: 1 1 260px; min-width: 0 }
.vhead h1 { font-weight: 800; font-size: 28px; line-height: 1.1 }
.vhead .lede { color: var(--muted); margin: 4px 0 0; max-width: 64ch }
.vhead .acts { display: flex; flex-wrap: wrap; gap: 8px }
.back { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-weight: 600; font-size: 13px; background: none; border: 0; padding: 0; margin-bottom: 6px }
.back:hover { color: var(--accent) }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 13px; min-height: 36px; cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; color: var(--fg); text-decoration: none }
.btn:hover { background: var(--surface-2) }
.btn.pri, .btn.primary, .btn.teal { background: var(--solid); color: var(--solid-fg); border-color: var(--solid) }
.btn.pri:hover, .btn.primary:hover, .btn.teal:hover { opacity: .88; background: var(--solid) }
.btn.cu { background: var(--accent); border-color: var(--accent); color: #fff }
.btn.ghost { border-color: transparent; background: none; color: var(--muted) }
.btn.ghost:hover { color: var(--red); background: none }
.btn.danger { color: var(--red); border-color: var(--red-soft) }
.btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red) }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px }
.btn[disabled] { opacity: .5; cursor: default }
.btn svg { width: 16px; height: 16px }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); flex-wrap: wrap }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--solid); color: var(--solid-fg) }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.filters input[type=search] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 11px; min-height: 38px }

.dtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow) }
.dtile { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--fg); border: 0; text-align: left; min-width: 0 }
.dtile:hover { background: var(--bg) }
.dtile .k { font-size: 12.5px; color: var(--muted) }
.dtile .v { font-weight: 800; letter-spacing: -.03em; font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums }
.dtile .v.bad { color: var(--red) }
.dtile .s { font-size: 12px; color: var(--accent); font-weight: 600 }
.qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.qa button { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 0; background: var(--surface); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow) }
.qa button:hover { background: var(--surface-2) }
.qa svg { width: 26px; height: 26px; flex: none; color: var(--accent); margin-top: 2px }
.qa b { display: block; font-size: 15.5px }
.qa small { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 2px }
.qa button.hot svg { color: var(--red) }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px }
.grid2 > * { min-width: 0 }
.panel { background: var(--surface); border-radius: 14px; padding: 16px; min-width: 0; box-shadow: var(--shadow) }
.panel h2 { font-weight: 800; font-size: 15.5px; letter-spacing: -.01em; margin: 0 0 12px; display: flex; align-items: center; gap: 8px }
.panel h2 .r { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0 }

.rlist { display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow) }
.panel .rlist { box-shadow: none; border: 1px solid var(--hair) }
.lrow { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; align-items: center; background: var(--surface); border: 0; border-bottom: 1px solid var(--hair); padding: 12px 16px 12px 30px; text-align: left; width: 100%; color: var(--fg) }
.lrow:last-child { border-bottom: 0 }
.lrow:hover { background: var(--bg) }
.lrow::before { content: ""; position: absolute; left: 14px; top: 19px; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--line)) }
.lrow .t { font-weight: 700; min-width: 0; overflow-wrap: anywhere }
.lrow .t .mono { margin-right: 8px; font-size: 11.5px }
.lrow .m { grid-column: 1; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; min-width: 0 }
.lrow .sr { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px }
.dot-red { --dot: var(--red) } .dot-amber { --dot: var(--amber) } .dot-blue { --dot: var(--blue) } .dot-green { --dot: var(--green) } .dot-cu { --dot: var(--accent) }
.over { color: var(--red); font-weight: 700 }
.empty { background: var(--surface); border-radius: 14px; padding: 28px 18px; text-align: center; color: var(--muted); box-shadow: var(--shadow) }
.panel .empty, .rlist .empty { box-shadow: none }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 1px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted) }
.pill.red { background: var(--red-soft); color: var(--red) } .pill.amber { background: var(--amber-soft); color: var(--amber) }
.pill.green { background: var(--green-soft); color: var(--green) } .pill.teal, .pill.cu { background: var(--accent-soft); color: var(--accent) }
.pill.blue { background: var(--blue-soft); color: var(--blue) } .pill.grey { background: var(--surface-2); color: var(--muted) }
.pill.ex { background: transparent; border: 1px dashed var(--muted); color: var(--muted); font-weight: 600 }

/* ---------- sheet (record editor) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10,10,9,.45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: max(4vh, env(safe-area-inset-top, 0px)) 16px 16px; overflow-y: auto }
.sheet { background: var(--surface); border-radius: 18px; width: 100%; max-width: 720px; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column }
.sheet.wide { max-width: 1180px }
.sheet > header { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--hair) }
.sheet > header h2 { flex: 1; min-width: 0; font-weight: 800; font-size: 20px; overflow-wrap: anywhere }
.x { border: 0; background: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 16px }
.x:hover { background: var(--surface-2) }
.sform { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; padding: 16px 18px }
.fl { display: flex; flex-direction: column; gap: 5px; grid-column: 1 / -1; min-width: 0 }
.fl.half { grid-column: auto }
.fl > span { font-size: 12.5px; color: var(--muted); font-weight: 600 }
.fl input, .fl select, .fl textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0 }
.fl textarea { min-height: 84px; resize: vertical }
.split { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 0 }
.split .sform { grid-template-columns: 1fr 1fr; align-content: start; border-right: 1px solid var(--hair) }
.split .prev { padding: 16px 18px; overflow-x: auto; background: var(--bg); min-width: 0 }
.sheet > footer { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--hair); align-items: center }
.sheet > footer .sp { flex: 1 }
.photos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.photos .ph { position: relative }
.photos img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block }
.photos .phx { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 11px; padding: 0 }

/* ---------- RCA workspace ---------- */
.rca-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end }
.rca-head .grow { flex: 1 1 280px; min-width: 0 }
.rca-head h1 { font-weight: 800; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere }
.rca-head .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px }
.rca-head select { width: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-height: 36px; font-weight: 600 }
.rca-body { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 18px; align-items: start }
nav.steps { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border-radius: 14px; padding: 8px; box-shadow: var(--shadow) }
nav.steps button { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 9px; color: var(--muted); font-weight: 600 }
nav.steps button:hover { background: var(--bg); color: var(--fg) }
nav.steps button[aria-current="step"] { background: var(--bg); color: var(--fg) }
nav.steps .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 800 }
nav.steps .done .n { background: var(--solid); border-color: var(--solid); color: var(--solid-fg) }
nav.steps [aria-current="step"] .n { border-color: var(--accent); color: var(--accent) }
nav.steps .done[aria-current="step"] .n { background: var(--accent); border-color: var(--accent); color: #fff }
nav.steps .lbl { font-size: 13.5px }
nav.steps .ct { font-size: 11px; font-variant-numeric: tabular-nums }
nav.steps .opt { font-size: 10.5px; color: var(--muted); font-weight: 500 }
nav.steps .sep { height: 1px; background: var(--hair); margin: 6px 8px }
#stepmain { min-width: 0 }

/* step cards (shared with the RCA method) */
.card { background: var(--surface); border-radius: 14px; padding: 22px; box-shadow: var(--shadow) }
.card + .card { margin-top: 16px }
.step-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px }
.step-head h2 { font-size: 20px; font-weight: 800 }
.step-head p { margin: 4px 0 0; color: var(--muted); max-width: 68ch }
.eyebrow { font-size: 12.5px; color: var(--accent); font-weight: 700 }
h3.sub { font-size: 14.5px; font-weight: 800; margin: 22px 0 10px; letter-spacing: -.01em }
h3.sub:first-child { margin-top: 0 }
.grid { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)) }
.grid .wide { grid-column: 1 / -1 }
label.f, div.f { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
label.f > span, div.f > span { font-size: 12.5px; color: var(--muted); font-weight: 600 }
label.f > span em { font-style: normal; font-size: 11px; color: var(--accent) }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=search], input:not([type]), select, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 14px; min-height: 38px }
textarea { resize: vertical; min-height: 64px }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft) }
input[type=color] { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--bg) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--amber-soft); border: 1px dashed var(--amber); border-radius: 12px; padding: 10px 14px; font-size: 13.5px }
.banner b { color: var(--amber) }
.banner.err { background: var(--red-soft); border-color: var(--red) }
.banner.err b { color: var(--red) }
.note { font-size: 13px; color: var(--muted) }
.warn { color: var(--amber); font-size: 13px; font-weight: 600 }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; margin: 6px 0 4px }
.tile { background: var(--surface); padding: 12px 14px }
.tile .k { font-size: 12px; color: var(--muted) }
.tile .v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px }
.tile .v.red { color: var(--red) }
.preview { background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; font-size: 15px; line-height: 1.55 }
.list { display: flex; flex-direction: column; gap: 8px }
.item { display: grid; gap: 8px; align-items: start; background: var(--bg); border-radius: 12px; padding: 10px }
.item.tl { grid-template-columns: 190px 150px minmax(0, 1fr) auto }
.item.capa, .item.root { grid-template-columns: minmax(0, 1fr) auto }
.item input, .item select, .item textarea { background: var(--surface) }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px }
table.t th, table.t td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--hair); white-space: nowrap }
table.t th { background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 11.5px }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums }
table.t tr.hl td { background: var(--red-soft) }
.fish-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px }
.bone { background: var(--bg); border-radius: 12px; padding: 12px }
.bone h4 { margin: 0 0 2px; font-size: 14px; font-weight: 800; display: flex; justify-content: space-between; gap: 8px }
.bone .hint { font-size: 12px; color: var(--muted); margin-bottom: 8px }
.bone input, .bone select { background: var(--surface) }
.cause { display: grid; grid-template-columns: minmax(0, 1fr) 112px auto; gap: 6px; margin-bottom: 6px; align-items: center }
.cause.root input[type=text] { border-color: var(--accent); font-weight: 700 }
.cause.ruled input[type=text] { text-decoration: line-through; color: var(--muted) }
.cause .tag { grid-column: 1 / -1; font-size: 11.5px; color: var(--amber); margin-top: -4px }
.svg-box { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 8px }

function costOf(c) {

  const fails = rows.filter(r => !/^(pm|pdm|pmp|cal|ins)/i.test(r.worktype || ""));
  fails.sort((a, b) => a.d - b.d);
  const ev = parseDate(c.meta.eventDate);
  const mode = (c.pcr.problem || "").trim().toLowerCase();
  const same = mode ? fails.filter(r => String(r.problem || "").toLowerCase() === mode) : [];
  const priorSame = same.filter(r => !ev || r.d < new Date(ev.getTime() - 864e5 * 2));
  let mtbf = null;
  if (fails.length > 1) { mtbf = (fails[fails.length - 1].d - fails[0].d) / 864e5 / (fails.length - 1); }
  const cost = fails.reduce((a, r) => a + num(r.cost), 0);

  let months = [];

    const start = new Date(Math.min(...rows.map(r => r.d))); const end = new Date(Math.max(ev ? ev.getTime() : 0, ...rows.map(r => +r.d)));
    let y = start.getFullYear(), m = start.getMonth();
    while (y < end.getFullYear() || (y === end.getFullYear() && m <= end.getMonth())) { months.push({ y, m, n: 0, ev: false }); m++; if (m > 11) { m = 0; y++; } if (months.length > 60) break; }
    if (months.length > 36) months = months.slice(-36);
    fails.forEach(r => { const b = months.find(x => x.y === r.d.getFullYear() && x.m === r.d.getMonth()); if (b) b.n++; });
    if (ev) { const b = months.find(x => x.y === ev.getFullYear() && x.m === ev.getMonth()); if (b) b.ev = true; }

  return { rows, fails, same, priorSame, mtbf, cost, months, repeat: priorSame.length > 0 };
}

  let t = h.fails.length + " corrective work orders on " + (c.meta.asset || "this asset") + " in " + span + " months";
  if (h.repeat) t += "; this is failure " + (h.priorSame.length + 1) + " of the " + c.pcr.problem + " mode";

}

    case "problem": return !!statementOf(c);
    case "timeline": return c.timeline.length;
    case "history": return c.wos.length;
    case "fishbone": return c.useFishbone ? CATS.reduce((a, k) => a + c.fishbone[k.k].length, 0) : 0;

  S.data.cases[c.id] = c; S.cur = c; S.step = "event"; S.ai = {}; S.pendingImport = null;
  saveRec("cases", c); go("rca");

function shrinkImage(f, max, type, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { const s = Math.min(1, max / img.width, max / img.height); const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); const g = cv.getContext("2d"); if (type === "image/jpeg") { g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); } g.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL(type, q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

problem(c) {

    <div style="display:grid;gap:6px;min-width:0"><input type="text" aria-label="What happened" placeholder="What happened" data-k="timeline.${t.i}.text" value="${esc(t.text)}"><input type="text" aria-label="Source" placeholder="Evidence source (choose or type)" list="dl-source" autocomplete="off" data-k="timeline.${t.i}.source" value="${esc(t.source)}" style="font-size:12px"></div>

fishbone(c) {

capa(c) {

function costTiles(c) {
  const k = costOf(c), cur = c.impact.currency;
  return `<div class="tiles"><div class="tile"><div class="k">Lost production</div><div class="v">${fmtMoney(k.downtime, cur)}</div></div><div class="tile"><div class="k">Labour + parts + other</div><div class="v">${fmtMoney(k.labour + k.parts + k.other, cur)}</div></div><div class="tile"><div class="k">Cost of failure</div><div class="v red">${fmtMoney(k.total, cur)}</div></div></div>`;
}
function stmtPreview(c) {
  const s = statementOf(c);
  const warn = s && CAUSE_WORDS.test(s) ? `<p class="warn" style="margin-top:6px">This contains a cause word ("${esc(s.match(CAUSE_WORDS)[0])}"). Describe the effect only; causes come from the analysis.</p>` : "";
  return `<div class="preview">${s ? esc(s) : '<span class="note">Fill in the fields above to build the statement.</span>'}</div>${warn}`;
}
function autoSummary(c) {
  const k = costOf(c), h = historyOf(c);
  const s = [];
  const st = statementOf(c);
  if (st) s.push(st);
  else if (c.meta.title) s.push(c.meta.title + " on " + fmtDate(c.meta.eventDate) + ".");
  if (h.repeat) s.push(`This is a repeat failure: the same ${c.pcr.problem} failure mode occurred ${h.priorSame.length} time${h.priorSame.length > 1 ? "s" : ""} on this asset in the previous ${h.months.length} months.`);
  if (c.roots.length) {
    const byType = ROOT_TYPES.map(t => [t, c.roots.filter(r => r.type === t).length]).filter(x => x[1]);
    s.push(`The analysis identified ${c.roots.length} root cause${c.roots.length > 1 ? "s" : ""} (${byType.map(x => x[1] + " " + x[0].toLowerCase()).join(", ")}): ${c.roots.map(r => r.text.replace(/\.$/, "").replace(/^./, ch => ch.toLowerCase())).slice(0, 3).join("; ")}.`);
  }
  if (c.capa.length) s.push(`${c.capa.length} corrective and preventive action${c.capa.length > 1 ? "s are" : " is"} proposed, each linked to a root cause with an owner, due date and effectiveness check.`);
  return s.join(" ");
}

/* ---------- SVG builders (shared by the app and the report) ---------- */
const PAL = { navy: "#1A1A1A", teal: "#B0683A", amber: "#E8A33D", red: "#C8473B", green: "#2E8B57", grey: "#5B6675", line: "#D5DCE4", ink: "#1C2430", soft: "#F5F7FA" };
function timelineSVG(c, accent) {
  const ev = [...c.timeline].filter(t => t.at || t.text).sort((a, b) => String(a.at).localeCompare(String(b.at)));
  if (!ev.length) return "";
  const W = 1000, H = 300, y0 = 150, pad = 70;
  const step = ev.length > 1 ? (W - pad * 2) / (ev.length - 1) : 0;
  const col = k => k === "failure" ? PAL.red : k === "initiating" ? PAL.amber : k === "restore" ? PAL.green : k === "response" ? PAL.teal : (accent || PAL.navy);
  let g = `<line x1="30" y1="${y0}" x2="${W - 30}" y2="${y0}" stroke="${PAL.line}" stroke-width="3"/>`;
  ev.forEach((t, i) => {
    const x = ev.length > 1 ? pad + i * step : W / 2; const up = i % 2 === 0;
    const ly = up ? y0 - 34 : y0 + 34;
    const lines = wrapLines(t.text, ev.length > 7 ? 18 : 24, 3);
    const big = t.kind === "failure" || t.kind === "initiating";
    g += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${up ? y0 - 26 : y0 + 26}" stroke="${PAL.line}" stroke-width="1.5"/>`;
    g += `<circle cx="${x}" cy="${y0}" r="${big ? 9 : 6}" fill="${col(t.kind)}" stroke="#fff" stroke-width="2"/>`;
    const baseY = up ? ly - (lines.length) * 13 - 4 : ly + 12;
    g += `<text x="${x}" y="${baseY}" text-anchor="middle" font-size="11" font-weight="700" fill="${col(t.kind)}">${esc(fmtDT(t.at))}</text>`;
    lines.forEach((ln, li) => g += `<text x="${x}" y="${baseY + 14 + li * 13}" text-anchor="middle" font-size="11" fill="${PAL.ink}">${esc(ln)}</text>`);
    if (big) g += `<text x="${x}" y="${up ? y0 + 26 : y0 - 18}" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing=".06em" fill="${col(t.kind)}">${t.kind === "failure" ? "POINT OF FAILURE" : "INITIATING EVENT"}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline of events" font-family="Inter, system-ui, sans-serif">${g}</svg>`;
}
function historySVG(c, h, accent) {
  const ms = h.months; if (!ms.length) return "";
  const W = 1000, H = 260, L = 46, R = 16, T = 40, B = 40;
  const max = Math.max(2, ...ms.map(m => m.n));
  const bw = (W - L - R) / ms.length;
  let g = `<text x="${L}" y="20" font-size="13" font-weight="700" fill="${PAL.ink}">${esc(historyTitle(c, h))}</text>`;
  for (let v = 0; v <= max; v++) { const y = T + (H - T - B) * (1 - v / max); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${PAL.line}" stroke-width="${v ? .7 : 1.2}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="${PAL.grey}">${v}</text>`; }
  g += `<text transform="translate(12 ${T + (H - T - B) / 2}) rotate(-90)" text-anchor="middle" font-size="10.5" fill="${PAL.grey}">Corrective WOs per month</text>`;
  const every = Math.ceil(ms.length / 12);
  ms.forEach((m, i) => {
    const x = L + i * bw; const hgt = (H - T - B) * (m.n / max);
    if (m.n) g += `<rect x="${x + bw * .18}" y="${H - B - hgt}" width="${bw * .64}" height="${hgt}" rx="2" fill="${m.ev ? PAL.red : (accent || PAL.navy)}"/>`;
    if (m.ev) g += `<text x="${x + bw / 2}" y="${H - B - hgt - 6}" text-anchor="middle" font-size="10" font-weight="700" fill="${PAL.red}">This event</text>`;
    if (i % every === 0 || m.ev) g += `<text x="${x + bw / 2}" y="${H - B + 16}" text-anchor="middle" font-size="10" fill="${m.ev ? PAL.red : PAL.grey}">${MONTHS[m.m]}${m.m === 0 || i === 0 ? " " + String(m.y).slice(2) : ""}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Failures per month" font-family="Inter, system-ui, sans-serif">${g}</svg>`;
}
function fishboneSVG(c, accent) {
  const W = 1080, H = 470, sy = 235, headX = 880;
  const brand = accent || PAL.navy;
  const prob = c.meta.title || c.problem.what || "Problem";
  let g = `<line x1="30" y1="${sy}" x2="${headX}" y2="${sy}" stroke="${brand}" stroke-width="4" stroke-linecap="round"/>`;
  g += `<path d="M${headX} ${sy - 70} L${W - 12} ${sy - 70} L${W - 12} ${sy + 70} L${headX} ${sy + 70} Z" fill="${brand}"/>`;
  wrapLines(prob, 22, 5).forEach((ln, i, a) => g += `<text x="${(headX + W - 12) / 2}" y="${sy - (a.length - 1) * 8.5 + i * 17 + 4}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${esc(ln)}</text>`);
  const xs = [250, 460, 670];
  CATS.forEach((cat, ci) => {
    const top = ci < 3, lx = xs[ci % 3];
    const y0 = top ? 44 : H - 44, x1 = lx + 150;
    g += `<line x1="${lx}" y1="${y0}" x2="${x1}" y2="${sy}" stroke="${PAL.grey}" stroke-width="2"/>`;
    g += `<rect x="${lx - 52}" y="${top ? y0 - 30 : y0 + 4}" width="104" height="24" rx="4" fill="${PAL.soft}" stroke="${PAL.line}"/><text x="${lx}" y="${top ? y0 - 13 : y0 + 21}" text-anchor="middle" font-size="12" font-weight="700" fill="${PAL.ink}">${cat.k}</text>`;
    const items = c.fishbone[cat.k].filter(z => z.text); const shown = items.slice(0, 5);
    shown.forEach((z, i) => {
      const t = (i + 1) / (Math.max(shown.length, 3) + 1); const x = lx + (x1 - lx) * t, y = y0 + (sy - y0) * t;
      const col = z.status === "root" ? (PAL.teal) : z.status === "ruled" ? "#9AA4B1" : PAL.ink;
      g += `<line x1="${x - 14}" y1="${y}" x2="${x}" y2="${y}" stroke="${z.status === "root" ? PAL.teal : PAL.line}" stroke-width="${z.status === "root" ? 2.5 : 1.5}"/>`;
      g += `<text x="${x - 18}" y="${y + 4}" text-anchor="end" font-size="11" ${z.status === "root" ? 'font-weight="700"' : ""} ${z.status === "ruled" ? 'text-decoration="line-through"' : ""} fill="${col}">${esc(trunc(z.text, 30))}</text>`;
    });
    if (items.length > 5) g += `<text x="${x1 - 10}" y="${top ? sy - 10 : sy + 18}" text-anchor="end" font-size="10" fill="${PAL.grey}">+${items.length - 5} more</text>`;
  });
  g += `<g font-size="10.5" fill="${PAL.grey}"><rect x="${headX}" y="14" width="10" height="3" fill="${PAL.teal}"/><text x="${headX + 16}" y="18">Root cause</text><rect x="${headX}" y="30" width="10" height="3" fill="${PAL.line}"/><text x="${headX + 16}" y="34">Candidate</text><text x="${headX}" y="50" text-decoration="line-through">Ruled out</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fishbone diagram" font-family="Inter, system-ui, sans-serif">${g}</svg>`;
}

function buildReport(c) {
  const m = c.meta, k = costOf(c), h = historyOf(c), cur = c.impact.currency, brand = m.brand || DEFAULT_BRAND, logo = m.logo || SET.logo;
  const st = statementOf(c);
  const summary = (c.summary || "").trim() || autoSummary(c);
  const confPill = v => `<span class="pill ${v === "High" ? "green" : v === "Medium" ? "amber" : "red"}">${esc(v || "Not rated")}</span>`;
  const typePill = v => `<span class="pill ${v === "Physical" ? "navy" : v === "Human" ? "amber" : "teal"}">${esc(v)}</span>`;
  const rcLabel = id => { const i = c.roots.findIndex(r => r.id === id); return i < 0 ? "–" : "RC" + (i + 1); };
  const hypo = [
    ...c.roots.filter(r => !r.evidence || r.confidence === "Low").map(r => r.text + " (" + (r.evidence ? "low confidence" : "no supporting evidence yet") + ")"),
    ...(c.useFishbone ? CATS : []).flatMap(cat => c.fishbone[cat.k].filter(z => z.status === "candidate" && z.text).map(z => z.text + " (" + cat.k + ", candidate not yet tested)"))
  ];
  const verified = c.roots.filter(r => r.evidence && r.confidence !== "Low");
  const tl = [...c.timeline].sort((a, b) => String(a.at).localeCompare(String(b.at)));
  const p = c.pcr;
  let secNo = 0; const nx = () => String(++secNo);
  const sec = (no, title, lead, body, brk) => `<section class="${brk ? "brk" : ""}"><h2><span class="no">${no}</span>${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ""}${body}</section>`;
  let html = `<div class="rpt"><div class="pg">
  <div class="cover"><div><div class="k">Root Cause Analysis</div><h1>${esc(m.title || "Untitled event")}</h1>
    <dl><div><dt>Customer</dt><dd>${esc(m.customer || "–")}</dd></div><div><dt>Site</dt><dd>${esc(m.site || "–")}</dd></div><div><dt>Asset</dt><dd>${esc(m.asset || "–")}${m.assetDesc ? "<br><span style=\"font-weight:400;opacity:.85\">" + esc(m.assetDesc) + "</span>" : ""}</dd></div><div><dt>Event date</dt><dd>${fmtDate(m.eventDate) || "–"}</dd></div>
    <div><dt>Report ID</dt><dd>${esc(m.reportId)} rev ${esc(m.revision)}</dd></div><div><dt>Author</dt><dd>${esc(m.author || "–")}</dd></div><div><dt>Report date</dt><dd>${fmtDate(m.reportDate)}</dd></div></dl></div>
    ${logo ? `<div class="logo"><img src="${logo}" alt="Logo"></div>` : ""}</div>`;
  html += sec(nx(), "Executive summary", "", `<p>${esc(summary)}</p>
    <div class="tiles"><div class="tile amber"><div class="k">Downtime</div><div class="v">${fmtN(num(c.impact.downtimeHrs), 1)} h</div></div>
    <div class="tile red"><div class="k">Cost of failure</div><div class="v">${fmtMoney(k.total, cur)}</div></div>
    <div class="tile ${h.repeat ? "red" : ""}"><div class="k">Repeat failures in period</div><div class="v">${h.priorSame.length}</div></div>
    <div class="tile"><div class="k">Root causes</div><div class="v">${c.roots.length}</div></div>
    <div class="tile"><div class="k">Actions</div><div class="v">${c.capa.length}</div></div></div>`);
  html += sec(nx(), "Problem statement and impact", "", `${st ? `<div class="stmt">${esc(st)}</div>` : ""}
    <div class="two"><table class="kv"><tbody>
      <tr><td>Main consequence</td><td>${esc(c.impact.consequence)}</td></tr><tr><td>Safety</td><td>${esc(c.impact.safety || "–")}</td></tr><tr><td>Environment</td><td>${esc(c.impact.env || "–")}</td></tr>
      <tr><td>Location</td><td>${esc(m.location || "–")}</td></tr><tr><td>RCA team</td><td>${esc(m.team || "–")}</td></tr></tbody></table>
    <table class="kv"><tbody>
      <tr><td>Downtime</td><td class="num">${fmtN(num(c.impact.downtimeHrs), 2)} h</td></tr>
      <tr><td>Lost production (${fmtN(num(c.impact.downtimeHrs), 2)} h × ${fmtMoney(num(c.impact.prodRate), cur)}/h)</td><td class="num">${fmtMoney(k.downtime, cur)}</td></tr>
      <tr><td>Repair labour</td><td class="num">${fmtMoney(k.labour, cur)}</td></tr><tr><td>Parts and materials</td><td class="num">${fmtMoney(k.parts, cur)}</td></tr><tr><td>Other</td><td class="num">${fmtMoney(k.other, cur)}</td></tr>
      <tr><td><b>Cost of failure</b></td><td class="num"><b>${fmtMoney(k.total, cur)}</b></td></tr></tbody></table></div>
    <div class="callout ${p.match === "yes" ? "ok" : ""}"><b>Failure coding.</b> Recorded as <span class="mono">${esc(codingOf(p) || "not recorded")}</span> (equipment class › failure mode › mechanism › cause › remedy).
      ${p.match === "no" ? ` The recorded cause does not match the verified root cause. Recommended cause code: <b>${esc(p.recommended || "to be agreed")}</b>. This is a coding-quality finding.` : p.match === "yes" ? " The recorded cause matches the verified root cause." : " Coding not yet checked against the root cause."}</div>`);
  html += sec(nx(), "Sequence of events", tl.length + " events from the evidence, in order. Markers are evenly spaced in sequence, not to time scale.", tl.length ? `<div class="fig">${timelineSVG(c, brand)}</div>
    <div class="tw"><table><thead><tr><th>Date and time</th><th>Type</th><th>Event</th><th>Source</th></tr></thead><tbody>${tl.map(t => `<tr><td style="white-space:nowrap">${fmtDT(t.at)}</td><td>${t.kind === "failure" ? '<span class="pill red">Point of failure</span>' : t.kind === "initiating" ? '<span class="pill amber">Initiating event</span>' : esc(TL_KINDS[t.kind] || "")}</td><td>${esc(t.text)}</td><td>${esc(t.source)}</td></tr>`).join("")}</tbody></table></div>` : "<p>No events recorded.</p>", true);
  html += sec(nx(), "Failure history", h.fails.length ? `${h.fails.length} corrective work orders on ${esc(m.asset)}; MTBF ${h.mtbf ? fmtN(h.mtbf) + " days" : "not calculable"}; corrective cost in period ${fmtMoney(h.cost, cur)}.` : "", h.months.length ? `<div class="fig">${historySVG(c, h, brand)}</div>
    ${h.same.length ? `<div class="tw"><table><thead><tr><th>WO</th><th>Date</th><th>Type</th><th>Problem</th><th>Cause</th><th class="num">Cost</th><th>Description</th></tr></thead><tbody>${h.same.map(r => `<tr><td class="mono">${esc(r.wonum)}</td><td style="white-space:nowrap">${fmtDate(isoDay(r.d))}</td><td>${esc(r.worktype)}</td><td>${esc(r.problem)}</td><td>${esc(r.cause)}</td><td class="num">${fmtN(num(r.cost))}</td><td>${esc(r.desc)}</td></tr>`).join("")}</tbody></table></div><p class="lead" style="margin-top:6px">Work orders with the same problem code (${esc(p.problem)}).</p>` : ""}` : "<p>No work order history was loaded for this asset.</p>");
  if (c.useFishbone) html += sec(nx(), "Cause analysis: fishbone (6M)", "Candidate causes by category. Root causes are highlighted; ruled-out causes are struck through.", `<div class="fig">${fishboneSVG(c, brand)}</div>`, true);
  html += sec(nx(), "Cause analysis: 5 Whys", "", c.whys.length ? c.whys.map(w => `<div class="chain"><h3>${esc(w.title)}</h3>${w.steps.filter(s => s.text).map((s, i, a) => `<div class="wcard ${i === a.length - 1 ? "root" : ""}"><div class="q">Why ${i + 1}</div><div>${esc(s.text)}${s.evidence ? `<div class="e">Evidence: ${esc(s.evidence)}</div>` : ""}</div></div>`).join("")}</div>`).join("") : "<p>No 5 Whys chains recorded.</p>");
  html += sec(nx(), "Root causes", "Physical root: the component mechanism. Human root: the decision or action. Latent root: the organisational gap that allowed it.", c.roots.length ? `<div class="tw"><table><thead><tr><th>#</th><th>Root cause</th><th>Type</th><th>Evidence</th><th>Confidence</th></tr></thead><tbody>${c.roots.map((r, i) => `<tr><td><b>RC${i + 1}</b></td><td>${esc(r.text)}</td><td>${typePill(r.type)}</td><td>${esc(r.evidence || "No evidence yet")}</td><td>${confPill(r.confidence)}</td></tr>`).join("")}</tbody></table></div>` : "<p>No root causes recorded.</p>", true);
  html += sec(nx(), "Corrective and preventive actions", "Ordered by the hierarchy of controls. Each action says how it will be carried out. Click a column heading to sort.", c.capa.length ? `<div class="tw"><table id="capaT"><thead><tr><th data-sort="0">#</th><th data-sort="1">Action</th><th data-sort="2">Root cause</th><th data-sort="3">Type</th><th data-sort="4">Carried out through</th><th data-sort="5">Owner</th><th data-sort="6">Due</th><th data-sort="7">Status</th><th>Effectiveness check</th></tr></thead><tbody>${[...c.capa].sort((a, b) => CAPA_TYPES.indexOf(a.type) - CAPA_TYPES.indexOf(b.type)).map((a, i) => `<tr><td>${i + 1}</td><td>${esc(a.action)}</td><td><b>${rcLabel(a.rootId)}</b></td><td><span class="pill ${a.type === "Eliminate" ? "green" : a.type === "Engineer" ? "teal" : a.type === "Monitor" ? "grey" : "navy"}">${esc(a.type)}</span></td><td>${esc(a.mobj)}</td><td>${esc(a.owner)}</td><td data-v="${esc(a.due)}" style="white-space:nowrap">${fmtDate(a.due)}</td><td>${esc(a.status)}</td><td>${esc(a.check)}</td></tr>`).join("")}</tbody></table></div>` : "<p>No actions recorded.</p>");
  const src = c.woSource;
  html += sec("A", "Appendix", "", `<div class="two"><div><h3 style="font-size:13px;margin:0 0 6px">Data sources</h3><ul>
      ${src ? `<li>${esc(src.file)}: ${fmtN(src.totalRows)} rows in file, ${fmtN(src.keptRows)} kept for ${esc(m.asset)}, ${fmtDate(src.dateFrom)} to ${fmtDate(src.dateTo)}, ${src.dupes} duplicate work orders removed. PM and inspection work types excluded from failure counts.</li>
      <li>Column mapping: <span class="mono">${Object.entries(src.mapping || {}).map(([a, b]) => esc(b) + " → " + a).join(", ")}</span></li>` : "<li>No CMMS export loaded.</li>"}
      ${[...new Set(tl.map(t => t.source).filter(Boolean))].map(s => `<li>${esc(s)}</li>`).join("")}</ul>
      <h3 style="font-size:13px;margin:12px 0 6px">Assumptions</h3><ul>${[c.impact.notes, c.assumptions].filter(Boolean).map(a => `<li>${esc(a)}</li>`).join("") || "<li>None recorded.</li>"}</ul></div>
    <div><h3 style="font-size:13px;margin:0 0 6px">Hypotheses requiring verification</h3><ul>${hypo.map(x => `<li>${esc(x)}</li>`).join("") || "<li>None. All root causes are supported by evidence.</li>"}</ul>
      ${c.dataNeeded ? `<h3 style="font-size:13px;margin:12px 0 6px">Data that would confirm open causes</h3><p>${esc(c.dataNeeded)}</p>` : ""}
      <h3 style="font-size:13px;margin:12px 0 6px">Method</h3><p>Problem statement (what, where, when, impact), sequence of events, failure history from CMMS work orders, ${c.useFishbone ? "6M fishbone, " : ""}5 Whys to a controllable cause, evidence test with confidence rating (${verified.length} of ${c.roots.length} root causes verified), and CAPA by the hierarchy of controls with an effectiveness check per action. Failure coding uses ISO 14224 style equipment class, failure mode, mechanism, cause and remedy.</p></div></div>`, true);
  html += `<div class="foot">${esc(m.reportId)} rev ${esc(m.revision)} · ${esc(m.customer)} · Generated ${fmtDate(isoDay(new Date()))}</div></div></div>`;

    case "cancel-import": S.pendingImport = null; rerender(); break;
    case "clear-wos": c.wos = []; c.woSource = null; changed(); break;
    case "export-html": offer(safeName(c.meta.reportId + " " + c.meta.title) + ".html", reportDocument(c)); break;
    case "export-xlsx": exportXlsx(); break;
    case "print": { const r = buildReport(c); printHTML(r.css, r.html); break; }
    case "export-json": offer(safeName(c.meta.reportId + " case") + ".json", JSON.stringify(c, null, 2)); break;
    case "import-json": $("#fileJSON").click(); break;
    case "ai-fish": aiFish(); break;
    case "ai-sum": aiSum(); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.edit) closeSheet(); });
$("#fileWO").addEventListener("change", e => { const f = e.target.files[0]; if (f) readWOFile(f); e.target.value = ""; });
$("#fileJSON").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let j; try { j = JSON.parse(await f.text()); } catch (err) { toast("That file could not be read"); return; }
  if (j && (j.format === "rootline-backup" || Array.isArray(j.cases))) { const n = await restoreBackup(j); rerender(); toast(n + " records restored from " + f.name); return; }
  if (!j || !j.meta) { toast("That file is not an RCA case file or a backup"); return; }
  const c = normalise(j); if (S.data.cases[c.id]) c.id = uid(); c.example = false; newCase(c); toast("Opened " + f.name);
});
$("#fileLogo").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { S.cur.meta.logo = await shrinkImage(f, 320, "image/png"); touch(); rerender(); } catch (err) { toast("That image could not be read"); }
});
$("#fileSetLogo").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { SET.logo = await shrinkImage(f, 400, "image/png"); saveSettings(); rerender(); } catch (err) { toast("That image could not be read"); }
});
$("#filePhoto").addEventListener("change", e => { const fs = e.target.files; if (fs && fs.length && S.edit) addPhotos(fs); e.target.value = ""; });
window.addEventListener("pagehide", flushSaves);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSaves(); });

/* ---------- boot ---------- */
async function boot() {
  $("#lists").innerHTML = Object.entries(LISTS).map(([id, items]) => `<datalist id="${id}">${items.map(v => `<option value="${esc(v)}"></option>`).join("")}</datalist>`).join("");
  document.querySelector(".appname").innerHTML = MARK() + `<div>${APP.name}<span class="tag">${APP.tagline}</span></div>`;
  await localInit();
  KINDS.forEach(k => Object.values(LOCAL[k]).forEach(r => { if (r && r.id) S.data[k][r.id] = NORM[k](r); }));
  if (LOCAL.settings) Object.assign(SET, LOCAL.settings);
  if (LOCAL.last && S.data.cases[LOCAL.last]) S.cur = S.data.cases[LOCAL.last];
  const cl = window.claude;
  if (!cl) { await seedExamples(); setSave("local", "Saved on this device"); render(); storageInfo(); return; }
  setSave("busy", "Connecting…"); render();
  const [db, dl, sm] = await Promise.all([cl.use?.("db") ?? null, cl.use?.("downloads") ?? null, cl.use?.("sample") ?? null].map(p => Promise.resolve(p).catch(() => null)));
  S.downloads = dl; S.sample = sm;
  if (db) {
    S.db = db;
    try {
      for (const k of KINDS) {
        const remote = (await db.collection(k).get()).docs.map(d => d.data()).filter(r => r && r.id);
        // move any records only saved in this browser up to the account
        for (const r of Object.values(LOCAL[k])) if (!remote.some(x => x.id === r.id)) { try { await db.doc(k + "/" + r.id).set(r); remote.push(r); } catch (e) { } }
        S.data[k] = {}; remote.forEach(r => { S.data[k][r.id] = NORM[k](r); });
      }
      const st = await db.doc("settings/app").get();
      if (st.exists) Object.assign(SET, st.data()); else saveSettings();
      S.cur = S.data.cases[LOCAL.last] || null;
      setSave("ok", "Saved");
    } catch (e) { console.warn(e); S.db = null; setSave("local", "Saved on this device"); }
  } else setSave("local", "Saved on this device");
  await seedExamples();
  rerender();
}
async function storageInfo() {
  try { const e = await navigator.storage?.estimate?.(); if (e && e.usage != null) { S.storageEst = (e.usage / 1048576).toFixed(1) + " MB of this device's storage"; if (S.view === "settings") rerender(); } } catch (err) { }
}
boot();

</script>

<script>
// Offline support: register the service worker (sw.js). Bump CACHE in sw.js on every release.
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW", e)));
}
</script>
